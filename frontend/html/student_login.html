<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="/frontend/css/slogin.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-buttons">
            <button type="button" id="loginTab" class="active">LOGIN</button>
            <button type="button" id="signupTab">SIGN UP</button>
        </div>

        <div class="auth-box">
            <form id="loginForm">
                <h1>Welcome Back</h1>
                <p>Login to your student account</p>

                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>

                <button type="submit" class="submit-button">LOGIN</button>
            </form>

            <form id="signupForm" hidden>
                <h1>Create Account</h1>
                <p>Create your student account</p>

                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" placeholder="Enter your full name" required>

                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required>

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                <button type="submit" class="submit-button">SIGN UP</button>
            </form>
        </div>
    </div>

    <script src="/frontend/app.js"></script>
</body>
</html>
